version: '3.8'

services:
  backend:
    build:
      context: backend
      args:
        PROJECT_NAME: sledzik
    volumes:
      - ./backend/:/srv/sledzik/
    ports:
      - "8080:8080"
    depends_on:
      - database

  frontend:
    build:
      context: frontend
      args:
        PROJECT_NAME: sledzik
    volumes:
      - ./frontend/:/srv/sledzik/
    ports:
      - "8081:8081"

  proxy:
    build: proxy
    ports:
      - "80:80"

  database:
    image: postgres:15.0-alpine
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_PASSWORD: postgres

volumes:
  postgres_data:
