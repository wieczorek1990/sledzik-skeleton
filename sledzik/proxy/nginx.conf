events {}

http {
    upstream backend {
        server backend:8080;
    }

    upstream frontend {
        server frontend:8081;
    }

    server {
        server_name api.sledzik.soiree.tech;
        listen 80;
        location / {
            proxy_pass http://backend;
        }
    }

    server {
        server_name sledzik.soiree.tech;
        listen 80;
        location / {
            proxy_pass http://frontend;
        }
    }
}
